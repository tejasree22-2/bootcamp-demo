name: Auto-merge Participant PRs

on:
  pull_request_target:
    paths:
      - 'participants/**'
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Check PR only touches participant folder
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const unsafe = files.filter(f =>
              !f.filename.startsWith('participants/')
            );

            if (unsafe.length > 0) {
              console.log('PR touches files outside participants/ folder — skipping auto-merge:');
              unsafe.forEach(f => console.log(' -', f.filename));
              core.setFailed('PR contains files outside allowed path.');
            } else {
              console.log('All files are inside participants/ — safe to merge.');
            }

      - name: Validate info.json files
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const jsonFiles = files.filter(f => f.filename.endsWith('info.json'));

            if (jsonFiles.length === 0) {
              core.setFailed('No info.json file found in this PR.');
              return;
            }

            for (const file of jsonFiles) {
              const { data: content } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: file.filename,
                ref: context.payload.pull_request.head.sha
              });

              const decoded = Buffer.from(content.content, 'base64').toString('utf-8');

              try {
                JSON.parse(decoded);
                console.log(`✓ ${file.filename} is valid JSON`);
              } catch (e) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: `❌ **Your \`info.json\` has an error and could not be merged.**\n\n**Error:** \`${e.message}\`\n\nPlease fix the JSON and push again — the PR will automatically re-check and merge once it's valid.`
                });
                core.setFailed(`Invalid JSON in ${file.filename}: ${e.message}`);
              }
            }

      - name: Auto-merge the PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash',
              commit_title: `Add ${context.payload.pull_request.user.login}'s participant page`
            });
            console.log('PR merged successfully.');
